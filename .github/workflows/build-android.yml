name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 📲 Install Expo CLI
        run: npm install -g expo-cli@latest

      - name: 📦 Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: 🔧 Expo prebuild (Android)
        working-directory: frontend
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build APK with Gradle
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kora-messenger-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: ✅ Report success
        run: |
          echo "## APK Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the Artifacts section of this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "Build commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
